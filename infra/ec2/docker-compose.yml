services:
  postgres:
    image: postgres:16
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smartparking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d smartparking']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  redis:
    image: redis:7
    container_name: smartparking-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartparking-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smartparking-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx256m'
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'smartparking-qa-cluster'
    networks:
      - smartparking-network

  # ── Auth Service (service_name: auth-service en el workflow matrix) ─────────
  auth-service:
    image: ${DOCKERHUB_USER}/smartparking-auth:qa
    container_name: smartparking-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: '3000'
    ports:
      - '3000:3000'
    networks:
      - smartparking-network

  app:
    image: ${APP_IMAGE:-${DOCKERHUB_USER}/smartparking-user:qa}
    container_name: smartparking-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${APP_PORT:-3001}:${APP_PORT:-3001}'
    networks:
      - smartparking-network

volumes:
  postgres_data:
  redis_data:

networks:
  smartparking-network:
    driver: bridge