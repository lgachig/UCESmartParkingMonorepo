services:
  postgres:
    image: postgres:16
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smartparking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U admin -d smartparking' ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  redis:
    image: redis:7
    container_name: smartparking-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartparking-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smartparking-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx256m'
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'smartparking-qa-cluster'
    networks:
      - smartparking-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartparking-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', '-q', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  auth-service:
    image: ${DOCKERHUB_USER}/smartparking-auth:qa
    container_name: smartparking-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: '3000'
    ports:
      - '3000:3000'
    networks:
      - smartparking-network

  # NOTA DE ARQUITECTURA (QA/EC2):
  # El servicio genérico 'app' corre una sola instancia de microservicio por host de EC2.
  # El valor de N8N_WEBHOOK_URL se inyecta dinámicamente mediante el archivo local '.env'
  # de cada instancia, apuntando al host 'n8n' (si se corre en la misma máquina) o a la IP
  # pública/privada de la instancia dedicada a infraestructura (donde corre este compose con n8n).
  app:
    image: ${APP_IMAGE:-${DOCKERHUB_USER}/smartparking-user:qa}
    container_name: smartparking-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${APP_PORT:-3001}:${APP_PORT:-3001}'
    networks:
      - smartparking-network

  n8n:
    image: n8nio/n8n:latest
    container_name: smartparking-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      GENERIC_TIMEZONE: America/Guayaquil
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:?set N8N_BASIC_AUTH_PASSWORD in .env}"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: admin
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - '5678:5678'
    networks:
      - smartparking-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  smartparking-network:
    driver: bridge
