name: PROD CI/CD

on:
  push:
    branches: [hotfix/USP-096-fix-deploy]
  pull_request:
    types: [closed]
    branches: [hotfix/USP-096-fix-deploy]
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all services regardless of file changes'
        type: boolean
        default: true

concurrency:
  group: prod-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-check:
    uses: ./.github/workflows/ci.yml

  get-changes:
    name: Read Changed Services
    needs: [ci-check]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      auth:        ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.auth == 'true' }}
      user:        ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.user == 'true' }}
      vehicle:     ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.vehicle == 'true' }}
      parking:     ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.parking == 'true' }}
      reservation: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.reservation == 'true' }}
      gateway:     ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.gateway == 'true' }}
      frontend:    ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.frontend == 'true' }}
      payment:     ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy_all == 'true') || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.payment == 'true' }}
    steps:
      - name: Echo changes
        run: |
          echo "auth=${{ needs.ci-check.outputs.auth }}"
          echo "user=${{ needs.ci-check.outputs.user }}"
          echo "vehicle=${{ needs.ci-check.outputs.vehicle }}"
          echo "parking=${{ needs.ci-check.outputs.parking }}"
          echo "reservation=${{ needs.ci-check.outputs.reservation }}"
          echo "gateway=${{ needs.ci-check.outputs.gateway }}"
          echo "frontend=${{ needs.ci-check.outputs.frontend }}"
          echo "payment=${{ needs.ci-check.outputs.payment }}"

  docker-push:
    name: Build & Push (${{ matrix.name }})
    needs: [get-changes]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROD_GATEWAY_URL: ${{ vars.PROD_GATEWAY_URL || secrets.PROD_GATEWAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            changed: ${{ needs.get-changes.outputs.auth }}
            dockerfile: smart-parking/apps/auth-service/dockerfile
            context: ./smart-parking
            image_suffix: auth
          - name: user
            changed: ${{ needs.get-changes.outputs.user }}
            dockerfile: smart-parking/apps/user-service/dockerfile
            context: ./smart-parking
            image_suffix: user
          - name: vehicle
            changed: ${{ needs.get-changes.outputs.vehicle }}
            dockerfile: smart-parking/apps/vehicle-service/dockerfile
            context: ./smart-parking
            image_suffix: vehicle
          - name: gateway
            changed: ${{ needs.get-changes.outputs.gateway }}
            dockerfile: smart-parking/apps/gateway-service/dockerfile
            context: ./smart-parking
            image_suffix: gateway
          - name: parking
            changed: ${{ needs.get-changes.outputs.parking }}
            dockerfile: smart-parking/apps/parking-service/dockerfile
            context: ./smart-parking
            image_suffix: parking
          - name: reservation
            changed: ${{ needs.get-changes.outputs.reservation }}
            dockerfile: smart-parking/apps/reservation-service/dockerfile
            context: ./smart-parking
            image_suffix: reservation
          - name: frontend
            changed: ${{ needs.get-changes.outputs.frontend }}
            dockerfile: smart-parking/apps/frontend/dockerfile
            context: ./smart-parking/apps/frontend
            image_suffix: frontend
          - name: payment
            changed: ${{ needs.get-changes.outputs.payment }}
            dockerfile: smart-parking/apps/payment-service/dockerfile
            context: ./smart-parking
            image_suffix: payment
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }} — sin cambios."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Verify PROD_GATEWAY_URL
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        run: |
          if [ -z "$PROD_GATEWAY_URL" ]; then
            echo "::error::Falta PROD_GATEWAY_URL — ponla en GitHub Environment prod → Variables"
            exit 1
          fi
          echo "PROD_GATEWAY_URL=$PROD_GATEWAY_URL"

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true'

      - uses: docker/login-action@v3
        if: matrix.changed == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        if: matrix.changed == 'true' && matrix.name != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-${{ matrix.image_suffix }}:prod

      - name: Push frontend
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-frontend:prod
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ env.PROD_GATEWAY_URL }}

  ensure-postgres:
    name: Ensure Postgres on auth
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [docker-push]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Discover auth private IP
        run: |
          AUTH_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=prod-auth" \
              "Name=tag:Environment,Values=prod" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)
          if [ -z "$AUTH_IP" ] || [ "$AUTH_IP" = "None" ]; then
            echo "::error::No se encontró instancia Name=prod-auth Environment=prod"
            exit 1
          fi
          echo "AUTH_IP=$AUTH_IP" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Start Postgres & Redis on auth EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.AUTH_IP }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -euo pipefail
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            sudo mkdir -p /opt/smartparking
            sudo chown ec2-user:ec2-user /opt/smartparking
            docker-compose -f "$COMPOSE_FILE" up -d postgres redis
            pg_c=$(docker-compose -f "$COMPOSE_FILE" ps -q postgres | head -1)
            [ -n "$pg_c" ] || { echo "❌ Postgres container not found"; exit 1; }
            for i in $(seq 1 30); do
              docker exec "$pg_c" pg_isready -U admin &>/dev/null && break
              [ "$i" -eq 30 ] && { echo "❌ PostgreSQL not ready"; exit 1; }
              sleep 2
            done
            for db in userdb vehicledb parkingdb reservationdb paymentdb; do
              docker exec "$pg_c" psql -U admin -d postgres \
                -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
              docker exec "$pg_c" psql -U admin -d postgres -c "CREATE DATABASE ${db};" || true
            done
            echo "✅ Postgres listo en auth"

  deploy:
    name: Deploy ${{ matrix.name }} on EC2 (via Bastion)
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [get-changes, ensure-postgres, docker-push]
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROD_GATEWAY_URL: ${{ vars.PROD_GATEWAY_URL || secrets.PROD_GATEWAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            service_tag: auth
            service_name: auth-service
            changed: ${{ needs.get-changes.outputs.auth }}
          - name: user
            service_tag: user
            service_name: app
            changed: ${{ needs.get-changes.outputs.user }}
          - name: vehicle
            service_tag: vehicle
            service_name: app
            changed: ${{ needs.get-changes.outputs.vehicle }}
          - name: parking
            service_tag: parking
            service_name: app
            changed: ${{ needs.get-changes.outputs.parking }}
          - name: reservation
            service_tag: reservation
            service_name: app
            changed: ${{ needs.get-changes.outputs.reservation }}
          - name: payment
            service_tag: payment
            service_name: app
            changed: ${{ needs.get-changes.outputs.payment }}
    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }}."

      - name: Configure AWS credentials
        if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Discover private IPs via AWS CLI
        if: matrix.changed == 'true'
        id: discover
        run: |
          discover_ip() {
            aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=prod-$1" \
                "Name=tag:Environment,Values=prod" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" \
              --output text
          }

          for svc in auth user vehicle parking reservation payment; do
            ip=$(discover_ip $svc)
            if [ -z "$ip" ] || [ "$ip" = "None" ]; then
              echo "❌ No se encontró instancia Name=prod-$svc Environment=prod"
              exit 1
            fi
            echo "✅ $svc → $ip"
            echo "${svc^^}_PRIVATE_IP=$ip" >> $GITHUB_ENV
          done

          TARGET_IP=$(discover_ip ${{ matrix.service_tag }})
          echo "PRIVATE_IP=$TARGET_IP" >> $GITHUB_ENV

      - name: Setup SSH key
        if: matrix.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Wait for SSH connectivity
        if: matrix.changed == 'true'
        run: |
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/prod.pem \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=10 \
                   -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/prod.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.PROD_BASTION_HOST }}" \
                   ec2-user@${{ env.PRIVATE_IP }} "echo OK" 2>/dev/null; then
              echo "✅ SSH conectado"
              break
            fi
            echo "⏳ Intento $i/10 — esperando..."
            sleep 15
          done

      - name: Deploy ${{ matrix.name }} — inject .env + pull + restart + migrate
        if: matrix.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script_stop: false
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            ENV_FILE="/opt/smartparking/.env"

            sudo mkdir -p /opt/smartparking
            sudo chown ec2-user:ec2-user /opt/smartparking
            touch "$ENV_FILE"
            chmod 644 "$ENV_FILE"

            patch_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                echo "${key}=${val}" >> "$ENV_FILE"
              fi
            }

            patch_env DOCKERHUB_USER       "${{ secrets.DOCKERHUB_USERNAME }}"
            patch_env JWT_SECRET           "${{ secrets.PROD_JWT_SECRET }}"
            patch_env JWT_REFRESH_SECRET   "${{ secrets.PROD_JWT_REFRESH_SECRET }}"
            patch_env INTERNAL_SERVICE_KEY "${{ secrets.PROD_INTERNAL_SERVICE_KEY }}"

            ALB_FRONTEND_URL=$(echo "${{ env.PROD_GATEWAY_URL }}" | sed -E 's|:3006(/api)?$||')
            CORS_LIST="http://${{ secrets.PROD_FRONTEND_EIP }}:3002,http://${{ secrets.PROD_GATEWAY_EIP }}:3006,${ALB_FRONTEND_URL},${{ env.PROD_GATEWAY_URL }}"
            patch_env CORS_ORIGINS "$CORS_LIST"

            if [ "${{ matrix.name }}" = "auth" ]; then
              patch_env PORT             3000
              patch_env DATABASE_URL     "postgresql://admin:admin@postgres:5432/smartparking"
              patch_env REDIS_URL        "redis://redis:6379"
              patch_env FRONTEND_URL     "${ALB_FRONTEND_URL}"
              patch_env USER_SERVICE_URL "http://${{ env.USER_PRIVATE_IP }}:3001/api"
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              patch_env USER_SERVICE_PORT  3001
              patch_env USER_DATABASE_URL  "postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/userdb"
              patch_env REDIS_URL          "redis://${{ env.AUTH_PRIVATE_IP }}:6379"
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              patch_env VEHICLE_SERVICE_PORT  3003
              patch_env VEHICLE_DATABASE_URL  "postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/vehicledb"
              patch_env REDIS_URL             "redis://${{ env.AUTH_PRIVATE_IP }}:6379"
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              patch_env PARKING_SERVICE_PORT  3004
              patch_env PARKING_DATABASE_URL  "postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/parkingdb"
              patch_env REDIS_URL             "redis://${{ env.AUTH_PRIVATE_IP }}:6379"
              patch_env KAFKA_BROKERS         "${{ env.AUTH_PRIVATE_IP }}:9092"
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              patch_env RESERVATION_SERVICE_PORT  3005
              patch_env RESERVATION_DATABASE_URL  "postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/reservationdb"
              patch_env REDIS_URL                 "redis://${{ env.AUTH_PRIVATE_IP }}:6379"
              patch_env KAFKA_BROKERS             "${{ env.AUTH_PRIVATE_IP }}:9092"
              patch_env PARKING_SERVICE_URL       "http://${{ env.PARKING_PRIVATE_IP }}:3004"
              patch_env USER_SERVICE_URL          "http://${{ env.USER_PRIVATE_IP }}:3001/api"
              patch_env VEHICLE_SERVICE_URL       "http://${{ env.VEHICLE_PRIVATE_IP }}:3003"
              patch_env RESERVATION_EXPIRY_MINUTES 15
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              patch_env PAYMENT_SERVICE_PORT    3007
              patch_env PAYMENT_DATABASE_URL    "postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/paymentdb"
              patch_env REDIS_URL               "redis://${{ env.AUTH_PRIVATE_IP }}:6379"
              patch_env RABBITMQ_URL            "amqp://guest:guest@${{ env.AUTH_PRIVATE_IP }}:5672"
              patch_env KAFKA_BROKERS           "${{ env.AUTH_PRIVATE_IP }}:9092"
              patch_env RESERVATION_SERVICE_URL "http://${{ env.RESERVATION_PRIVATE_IP }}:3005"
              patch_env USER_SERVICE_URL        "http://${{ env.USER_PRIVATE_IP }}:3001/api"
              patch_env STRIPE_SECRET_KEY       "${{ secrets.STRIPE_SECRET_KEY }}"
              patch_env STRIPE_PUBLIC_KEY       "${{ secrets.STRIPE_PUBLIC_KEY }}"
              patch_env STRIPE_WEBHOOK_SECRET   "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker-compose -f "$COMPOSE_FILE" pull ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" up -d --force-recreate ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" ps

            if [ "${{ matrix.name }}" = "auth" ]; then
              echo "⏳ Esperando PostgreSQL (smartparking)..."
              pg_container=$(docker-compose -f "$COMPOSE_FILE" ps -q postgres)
              for i in $(seq 1 30); do
                docker exec "$pg_container" pg_isready -U admin -d smartparking &>/dev/null && break
                sleep 1
              done

              for db in userdb vehicledb parkingdb reservationdb paymentdb; do
                docker exec "$pg_container" psql -U admin -d postgres \
                  -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
                  docker exec "$pg_container" psql -U admin -d postgres -c "CREATE DATABASE ${db};" || true
                echo "  ✔ DB ${db}"
              done

              echo "▶ Migraciones auth → smartparking"
              docker-compose -f "$COMPOSE_FILE" exec -T auth-service \
                npx prisma migrate deploy --schema prisma/auth/schema.prisma
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              echo "▶ Migraciones user → userdb"
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e USER_DATABASE_URL="postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/userdb" \
                app npx prisma migrate deploy --config prisma.user.config.ts
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              echo "▶ Migraciones vehicle → vehicledb"
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e VEHICLE_DATABASE_URL="postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/vehicledb" \
                app npx prisma migrate deploy --config prisma.vehicle.config.ts
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              echo "▶ Migraciones parking → parkingdb"
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PARKING_DATABASE_URL="postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/parkingdb" \
                app npx prisma migrate deploy --config prisma.parking.config.ts
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              echo "▶ Migraciones reservation → reservationdb"
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e RESERVATION_DATABASE_URL="postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/reservationdb" \
                app npx prisma migrate deploy --config prisma.reservation.config.ts
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              echo "▶ Migraciones payment → paymentdb"
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PAYMENT_DATABASE_URL="postgresql://admin:admin@${{ env.AUTH_PRIVATE_IP }}:5432/paymentdb" \
                app npx prisma migrate deploy --config prisma.payment.config.ts
            fi

            echo "✅ ${{ matrix.name }} deployado exitosamente."

  refresh-asg:
    name: Refresh ASG (frontend & gateway)
    needs: [get-changes, docker-push]
    if: (github.event_name != 'pull_request' || github.event.pull_request.merged == true) && (needs.get-changes.outputs.frontend == 'true' || needs.get-changes.outputs.gateway == 'true')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Refresh Frontend ASG
        if: needs.get-changes.outputs.frontend == 'true'
        run: |
          echo "Starting instance refresh for prod-frontend-asg..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name prod-frontend-asg \
            --query "InstanceRefreshId" --output text)
          echo "Instance refresh started successfully. ID: $REFRESH_ID"

      - name: Refresh Gateway ASG
        if: needs.get-changes.outputs.gateway == 'true'
        run: |
          echo "Starting instance refresh for prod-gateway-asg..."
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name prod-gateway-asg \
            --query "InstanceRefreshId" --output text)
          echo "Instance refresh started successfully. ID: $REFRESH_ID"