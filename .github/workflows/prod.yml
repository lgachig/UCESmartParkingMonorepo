name: PROD CI/CD

on:
  push:
    branches: [fea]
  pull_request:
    types: [closed]
    branches: [fea]
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all services regardless of file changes'
        type: boolean
        default: true

concurrency:
  group: prod-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-check:
    uses: ./.github/workflows/ci.yml

  get-changes:
    name: Read Changed Services
    needs: [ci-check]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      auth:        ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.auth == 'true' }}
      user:        ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.user == 'true' }}
      vehicle:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.vehicle == 'true' }}
      parking:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.parking == 'true' }}
      reservation: ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.reservation == 'true' }}
      gateway:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.gateway == 'true' }}
      frontend:    ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.frontend == 'true' }}
      payment:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.payment == 'true' }}
      realtime:    ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.realtime == 'true' }}
      notification: ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.notification == 'true' }}
      audit:       ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.audit == 'true' }}
      ai:          ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.ai == 'true' }}
    steps:
      - name: Echo changes
        run: |
          echo "auth=${{ needs.ci-check.outputs.auth }}"
          echo "user=${{ needs.ci-check.outputs.user }}"
          echo "vehicle=${{ needs.ci-check.outputs.vehicle }}"
          echo "parking=${{ needs.ci-check.outputs.parking }}"
          echo "reservation=${{ needs.ci-check.outputs.reservation }}"
          echo "gateway=${{ needs.ci-check.outputs.gateway }}"
          echo "frontend=${{ needs.ci-check.outputs.frontend }}"
          echo "payment=${{ needs.ci-check.outputs.payment }}"
          echo "realtime=${{ needs.ci-check.outputs.realtime }}"
          echo "notification=${{ needs.ci-check.outputs.notification }}"
          echo "audit=${{ needs.ci-check.outputs.audit }}"
          echo "ai=${{ needs.ci-check.outputs.ai }}"

  docker-push:
    name: Build & Push (${{ matrix.name }})
    needs: [get-changes]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROD_GATEWAY_URL: ${{ secrets.PROD_GATEWAY_URL }}
      PROD_REALTIME_URL: ${{ secrets.PROD_REALTIME_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            changed: ${{ needs.get-changes.outputs.auth }}
            dockerfile: smart-parking/apps/auth-service/dockerfile
            context: ./smart-parking
            image_suffix: auth
          - name: user
            changed: ${{ needs.get-changes.outputs.user }}
            dockerfile: smart-parking/apps/user-service/dockerfile
            context: ./smart-parking
            image_suffix: user
          - name: vehicle
            changed: ${{ needs.get-changes.outputs.vehicle }}
            dockerfile: smart-parking/apps/vehicle-service/dockerfile
            context: ./smart-parking
            image_suffix: vehicle
          - name: gateway
            changed: ${{ needs.get-changes.outputs.gateway }}
            dockerfile: smart-parking/apps/gateway-service/dockerfile
            context: ./smart-parking
            image_suffix: gateway
          - name: parking
            changed: ${{ needs.get-changes.outputs.parking }}
            dockerfile: smart-parking/apps/parking-service/dockerfile
            context: ./smart-parking
            image_suffix: parking
          - name: reservation
            changed: ${{ needs.get-changes.outputs.reservation }}
            dockerfile: smart-parking/apps/reservation-service/dockerfile
            context: ./smart-parking
            image_suffix: reservation
          - name: frontend
            changed: ${{ needs.get-changes.outputs.frontend }}
            dockerfile: smart-parking/apps/frontend/dockerfile
            context: ./smart-parking/apps/frontend
            image_suffix: frontend
          - name: payment
            changed: ${{ needs.get-changes.outputs.payment }}
            dockerfile: smart-parking/apps/payment-service/dockerfile
            context: ./smart-parking
            image_suffix: payment
          - name: realtime
            changed: ${{ needs.get-changes.outputs.realtime }}
            dockerfile: smart-parking/apps/realtime-service/dockerfile
            context: ./smart-parking
            image_suffix: realtime
          - name: notification
            changed: ${{ needs.get-changes.outputs.notification }}
            dockerfile: smart-parking/apps/notification-service/dockerfile
            context: ./smart-parking
            image_suffix: notification
          - name: audit
            changed: ${{ needs.get-changes.outputs.audit }}
            dockerfile: smart-parking/apps/audit-service/dockerfile
            context: ./smart-parking
            image_suffix: audit
          - name: ai
            changed: ${{ needs.get-changes.outputs.ai }}
            dockerfile: smart-parking/apps/ai-service/dockerfile
            context: ./smart-parking
            image_suffix: ai

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }} — sin cambios."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true'

      - uses: docker/login-action@v3
        if: matrix.changed == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        if: matrix.changed == 'true' && matrix.name != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-${{ matrix.image_suffix }}:prod

      - name: Verify PROD_GATEWAY_URL and PROD_REALTIME_URL
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        run: |
          if [ -z "$PROD_GATEWAY_URL" ]; then
            echo "::error::Falta PROD_GATEWAY_URL — configúrala en GitHub Environments prod"
            exit 1
          fi
          if [ -z "$PROD_REALTIME_URL" ]; then
            echo "::error::Falta PROD_REALTIME_URL — EIP pública de realtime (prod-lab-b), ej. http://<eip>:3008"
            exit 1
          fi

      - name: Push frontend
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-frontend:prod
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ env.PROD_GATEWAY_URL }}/api
            NEXT_PUBLIC_REALTIME_URL=${{ env.PROD_REALTIME_URL }}

  discover-ips:
    name: Discover Private IPs
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [docker-push]
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      auth_ip:        ${{ steps.ips.outputs.auth_ip }}
      user_ip:        ${{ steps.ips.outputs.user_ip }}
      vehicle_ip:     ${{ steps.ips.outputs.vehicle_ip }}
      parking_ip:     ${{ steps.ips.outputs.parking_ip }}
      notification_ip: ${{ steps.ips.outputs.notification_ip }}
      audit_ip:       ${{ steps.ips.outputs.audit_ip }}
      reservation_ip: ${{ steps.ips.outputs.reservation_ip }}
      payment_ip:     ${{ steps.ips.outputs.payment_ip }}
      realtime_ip:    ${{ steps.ips.outputs.realtime_ip }}
      ai_ip:          ${{ steps.ips.outputs.ai_ip }}
      gateway_ips:    ${{ steps.ips.outputs.gateway_ips }}
      frontend_ips:   ${{ steps.ips.outputs.frontend_ips }}

    steps:
      - name: Configure AWS credentials (Account A — prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get IPs (Account A — prod)
        id: ips_prod_a
        run: |
          set -euo pipefail

          echo "── Cuenta AWS (debe ser Account A / prod, NO Lab B) ──"
          aws sts get-caller-identity

          echo ""
          echo "── Instancias running con tag Environment=prod ──"
          aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].{Service:Tags[?Key==\`Service\`].Value|[0],Name:Tags[?Key==\`Name\`].Value|[0],PrivateIP:PrivateIpAddress,State:State.Name}" \
            --output table || true

          get_ip() {
            local svc="$1"
            local ip
            echo "→ Buscando Service=${svc}..." >&2
            ip=$(aws ec2 describe-instances \
              --filters "Name=tag:Service,Values=${svc}" "Name=tag:Environment,Values=prod" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" --output text 2>/dev/null)
            if [ -z "$ip" ] || [ "$ip" = "None" ] || [ "$ip" = "null" ]; then
              echo "::error::No hay EC2 running con tags Service=${svc} + Environment=prod. Si falta notification/audit: cd infra/terraform/environments/prod && terraform apply" >&2
              return 1
            fi
            echo "  ✔ ${svc}=${ip}" >&2
            echo "$ip"
          }

          get_ips_multi() {
            local svc="$1"
            local ips
            echo "→ Buscando ASG Service=${svc}..." >&2
            ips=$(aws ec2 describe-instances \
              --filters "Name=tag:Service,Values=${svc}" "Name=tag:Environment,Values=prod" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].PrivateIpAddress" --output text 2>/dev/null | tr '\t' ',' | tr ' ' ',' | sed 's/,,*/,/g;s/^,//;s/,$//')
            if [ -z "$ips" ]; then
              echo "::error::No hay instancias ASG running con Service=${svc} + Environment=prod (gateway/frontend). Revisa el ASG en la consola AWS." >&2
              return 1
            fi
            echo "  ✔ ${svc}=${ips}" >&2
            echo "$ips"
          }

          AUTH_IP=$(get_ip "auth")               || exit 1
          USER_IP=$(get_ip "user")               || exit 1
          VEHICLE_IP=$(get_ip "vehicle")         || exit 1
          PARKING_IP=$(get_ip "parking")         || exit 1
          NOTIFICATION_IP=$(get_ip "notification") || exit 1
          AUDIT_IP=$(get_ip "audit")               || exit 1
          GATEWAY_IPS=$(get_ips_multi "gateway")   || exit 1
          FRONTEND_IPS=$(get_ips_multi "frontend") || exit 1

          echo "auth_ip=$AUTH_IP"           >> $GITHUB_OUTPUT
          echo "user_ip=$USER_IP"           >> $GITHUB_OUTPUT
          echo "vehicle_ip=$VEHICLE_IP"     >> $GITHUB_OUTPUT
          echo "parking_ip=$PARKING_IP"     >> $GITHUB_OUTPUT
          echo "notification_ip=$NOTIFICATION_IP" >> $GITHUB_OUTPUT
          echo "audit_ip=$AUDIT_IP"         >> $GITHUB_OUTPUT
          echo "gateway_ips=$GATEWAY_IPS"   >> $GITHUB_OUTPUT
          echo "frontend_ips=$FRONTEND_IPS" >> $GITHUB_OUTPUT

          echo "[prod Account A] auth=$AUTH_IP | user=$USER_IP | vehicle=$VEHICLE_IP | parking=$PARKING_IP | notification=$NOTIFICATION_IP | audit=$AUDIT_IP | gateway(asg)=$GATEWAY_IPS | frontend(asg)=$FRONTEND_IPS"

      - name: Configure AWS credentials (Account B — prod-lab-b)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_LAB_B }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_LAB_B }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN_LAB_B }}
          aws-region: us-east-1

      - name: Get IPs (Account B — prod-lab-b)
        id: ips_prod_b
        run: |
          get_ip() {
            local svc="$1"
            local ip
            ip=$(aws ec2 describe-instances \
              --filters "Name=tag:Service,Values=${svc}" "Name=tag:Environment,Values=prod-lab-b" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" --output text 2>/dev/null)
            if [ -z "$ip" ] || [ "$ip" = "None" ] || [ "$ip" = "null" ]; then
              echo "::error::No EC2 running for Service=${svc} (prod-lab-b)"; return 1
            fi
            echo "$ip"
          }

          RESERVATION_IP=$(get_ip "reservation") || exit 1
          PAYMENT_IP=$(get_ip "payment")         || exit 1
          REALTIME_IP=$(get_ip "realtime")       || exit 1
          AI_IP=$(get_ip "ai")                   || exit 1

          echo "reservation_ip=$RESERVATION_IP" >> $GITHUB_OUTPUT
          echo "payment_ip=$PAYMENT_IP"         >> $GITHUB_OUTPUT
          echo "realtime_ip=$REALTIME_IP"       >> $GITHUB_OUTPUT
          echo "ai_ip=$AI_IP"                     >> $GITHUB_OUTPUT

          echo "[prod-lab-b Account B] reservation=$RESERVATION_IP | payment=$PAYMENT_IP | realtime=$REALTIME_IP | ai=$AI_IP"

      - name: Combine outputs
        id: ips
        run: |
          echo "auth_ip=${{ steps.ips_prod_a.outputs.auth_ip }}"               >> $GITHUB_OUTPUT
          echo "user_ip=${{ steps.ips_prod_a.outputs.user_ip }}"               >> $GITHUB_OUTPUT
          echo "vehicle_ip=${{ steps.ips_prod_a.outputs.vehicle_ip }}"         >> $GITHUB_OUTPUT
          echo "parking_ip=${{ steps.ips_prod_a.outputs.parking_ip }}"         >> $GITHUB_OUTPUT
          echo "notification_ip=${{ steps.ips_prod_a.outputs.notification_ip }}" >> $GITHUB_OUTPUT
          echo "audit_ip=${{ steps.ips_prod_a.outputs.audit_ip }}"               >> $GITHUB_OUTPUT
          echo "gateway_ips=${{ steps.ips_prod_a.outputs.gateway_ips }}"       >> $GITHUB_OUTPUT
          echo "frontend_ips=${{ steps.ips_prod_a.outputs.frontend_ips }}"     >> $GITHUB_OUTPUT
          echo "reservation_ip=${{ steps.ips_prod_b.outputs.reservation_ip }}" >> $GITHUB_OUTPUT
          echo "payment_ip=${{ steps.ips_prod_b.outputs.payment_ip }}"         >> $GITHUB_OUTPUT
          echo "realtime_ip=${{ steps.ips_prod_b.outputs.realtime_ip }}"       >> $GITHUB_OUTPUT
          echo "ai_ip=${{ steps.ips_prod_b.outputs.ai_ip }}"                     >> $GITHUB_OUTPUT

  ensure-postgres:
    name: Ensure Postgres on auth
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [discover-ips]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Start Postgres on auth EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.discover-ips.outputs.auth_ip }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -euo pipefail
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            docker-compose -f "$COMPOSE_FILE" up -d postgres redis
            pg_c=$(docker-compose -f "$COMPOSE_FILE" ps -q postgres | head -1)
            [ -n "$pg_c" ] || { echo "❌ Postgres container not found"; exit 1; }
            for i in $(seq 1 30); do
              docker exec "$pg_c" pg_isready -U admin &>/dev/null && break
              [ "$i" -eq 30 ] && { echo "❌ PostgreSQL not ready"; exit 1; }
              sleep 2
            done
            for db in userdb vehicledb parkingdb reservationdb paymentdb auditdb; do
              docker exec "$pg_c" psql -U admin -d postgres \
                -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
              docker exec "$pg_c" psql -U admin -d postgres -c "CREATE DATABASE ${db};" || true
            done
            echo "✅ Postgres listo en auth"

  ensure-parking-schema:
    name: Ensure parkingdb schema is up to date
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [discover-ips, ensure-postgres]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Reset & migrate parkingdb
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.discover-ips.outputs.parking_ip }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          envs: >-
            AUTH_PRIVATE_IP
          script: |
            set -euo pipefail
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            AUTH_PRIVATE_IP="${{ needs.discover-ips.outputs.auth_ip }}"

            echo "Resetting parkingdb schema..."
            docker run --rm -e PGPASSWORD=admin -e PGCONNECT_TIMEOUT=5 postgres:16 \
              psql -h "${AUTH_PRIVATE_IP}" -U admin -d parkingdb -v ON_ERROR_STOP=1 -c \
              "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO admin; GRANT ALL ON SCHEMA public TO public;"

            echo "Running parking migrations..."
            docker-compose -f "$COMPOSE_FILE" stop app
            docker-compose -f "$COMPOSE_FILE" run --rm \
              -e PARKING_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/parkingdb" \
              app npx prisma migrate deploy --config prisma.parking.config.ts
            docker-compose -f "$COMPOSE_FILE" up -d app

            echo "✅ parkingdb sincronizado"

  ensure-mongo:
    name: Ensure MongoDB on auth
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [discover-ips]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Start MongoDB on auth EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.discover-ips.outputs.auth_ip }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -euo pipefail
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            if ! grep -q 'mongo:' "$COMPOSE_FILE" 2>/dev/null; then
              echo "MongoDB no está en docker-compose de auth prod — omitiendo (ai usará otro backend si aplica)"
              exit 0
            fi
            docker-compose -f "$COMPOSE_FILE" up -d mongo
            for i in $(seq 1 15); do
              docker-compose -f "$COMPOSE_FILE" exec -T mongo mongosh --quiet --eval "db.adminCommand('ping')" &>/dev/null && break
              [ "$i" -eq 15 ] && { echo "❌ MongoDB not ready"; exit 1; }
              sleep 2
            done
            echo "✅ MongoDB listo en auth"

  ensure-kafka:
    name: Ensure Kafka/RabbitMQ on auth
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [discover-ips]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Start Kafka/RabbitMQ on auth EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.discover-ips.outputs.auth_ip }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -euo pipefail
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            docker-compose -f "$COMPOSE_FILE" up -d kafka rabbitmq
            echo "✅ Kafka/RabbitMQ listos en auth"

  deploy:
    name: Deploy ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [get-changes, discover-ips, ensure-postgres, ensure-mongo, ensure-parking-schema, ensure-kafka]
    runs-on: ubuntu-latest
    environment: prod
    env:
      PROD_GATEWAY_URL:  ${{ secrets.PROD_GATEWAY_URL }}
      PROD_FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            service_name: auth-service
            image_suffix: auth
            app_port: '3000'
            changed: ${{ needs.get-changes.outputs.auth }}
          - name: user
            service_name: app
            image_suffix: user
            app_port: '3001'
            changed: ${{ needs.get-changes.outputs.user }}
          - name: vehicle
            service_name: app
            image_suffix: vehicle
            app_port: '3003'
            changed: ${{ needs.get-changes.outputs.vehicle }}
          - name: gateway
            service_name: app
            image_suffix: gateway
            app_port: '3006'
            changed: ${{ needs.get-changes.outputs.gateway }}
          - name: parking
            service_name: app
            image_suffix: parking
            app_port: '3004'
            changed: ${{ needs.get-changes.outputs.parking }}
          - name: reservation
            service_name: app
            image_suffix: reservation
            app_port: '3005'
            changed: ${{ needs.get-changes.outputs.reservation }}
          - name: frontend
            service_name: app
            image_suffix: frontend
            app_port: '3002'
            changed: ${{ needs.get-changes.outputs.frontend }}
          - name: payment
            service_name: app
            image_suffix: payment
            app_port: '3007'
            changed: ${{ needs.get-changes.outputs.payment }}
          - name: realtime
            service_name: app
            image_suffix: realtime
            app_port: '3008'
            changed: ${{ needs.get-changes.outputs.realtime }}
          - name: notification
            service_name: app
            image_suffix: notification
            app_port: '3011'
            changed: ${{ needs.get-changes.outputs.notification }}
          - name: audit
            service_name: app
            image_suffix: audit
            app_port: '3012'
            changed: ${{ needs.get-changes.outputs.audit }}
          - name: ai
            service_name: app
            image_suffix: ai
            app_port: '3009'
            changed: ${{ needs.get-changes.outputs.ai }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }}."

      - name: Load IPs
        if: matrix.changed == 'true'
        run: |
          echo "AUTH_PRIVATE_IP=${{ needs.discover-ips.outputs.auth_ip }}"               >> $GITHUB_ENV
          echo "USER_PRIVATE_IP=${{ needs.discover-ips.outputs.user_ip }}"               >> $GITHUB_ENV
          echo "VEHICLE_PRIVATE_IP=${{ needs.discover-ips.outputs.vehicle_ip }}"         >> $GITHUB_ENV
          echo "PARKING_PRIVATE_IP=${{ needs.discover-ips.outputs.parking_ip }}"         >> $GITHUB_ENV
          echo "NOTIFICATION_PRIVATE_IP=${{ needs.discover-ips.outputs.notification_ip }}" >> $GITHUB_ENV
          echo "AUDIT_PRIVATE_IP=${{ needs.discover-ips.outputs.audit_ip }}"             >> $GITHUB_ENV
          echo "RESERVATION_PRIVATE_IP=${{ needs.discover-ips.outputs.reservation_ip }}" >> $GITHUB_ENV
          echo "PAYMENT_PRIVATE_IP=${{ needs.discover-ips.outputs.payment_ip }}"         >> $GITHUB_ENV
          echo "REALTIME_PRIVATE_IP=${{ needs.discover-ips.outputs.realtime_ip }}"       >> $GITHUB_ENV
          echo "AI_PRIVATE_IP=${{ needs.discover-ips.outputs.ai_ip }}"                   >> $GITHUB_ENV
          echo "GATEWAY_PRIVATE_IPS=${{ needs.discover-ips.outputs.gateway_ips }}"       >> $GITHUB_ENV
          echo "FRONTEND_PRIVATE_IPS=${{ needs.discover-ips.outputs.frontend_ips }}"     >> $GITHUB_ENV

      - name: Resolve target host(s)
        if: matrix.changed == 'true'
        run: |
          case "${{ matrix.name }}" in
            auth)        echo "PRIVATE_IP=${{ needs.discover-ips.outputs.auth_ip }}"        >> $GITHUB_ENV ;;
            user)        echo "PRIVATE_IP=${{ needs.discover-ips.outputs.user_ip }}"        >> $GITHUB_ENV ;;
            vehicle)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.vehicle_ip }}"     >> $GITHUB_ENV ;;
            parking)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.parking_ip }}"     >> $GITHUB_ENV ;;
            notification) echo "PRIVATE_IP=${{ needs.discover-ips.outputs.notification_ip }}" >> $GITHUB_ENV ;;
            audit)       echo "PRIVATE_IP=${{ needs.discover-ips.outputs.audit_ip }}"         >> $GITHUB_ENV ;;
            reservation) echo "PRIVATE_IP=${{ needs.discover-ips.outputs.reservation_ip }}" >> $GITHUB_ENV ;;
            payment)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.payment_ip }}"     >> $GITHUB_ENV ;;
            realtime)    echo "PRIVATE_IP=${{ needs.discover-ips.outputs.realtime_ip }}"   >> $GITHUB_ENV ;;
            ai)          echo "PRIVATE_IP=${{ needs.discover-ips.outputs.ai_ip }}"         >> $GITHUB_ENV ;;
            gateway)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.gateway_ips }}"    >> $GITHUB_ENV ;;
            frontend)    echo "PRIVATE_IP=${{ needs.discover-ips.outputs.frontend_ips }}"   >> $GITHUB_ENV ;;
          esac

      - name: Setup SSH
        if: matrix.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_EC2_SSH_KEY }}" > ~/.ssh/prod.pem
          chmod 400 ~/.ssh/prod.pem
          ssh-keyscan -H ${{ secrets.PROD_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Wait SSH
        if: matrix.changed == 'true'
        run: |
          FIRST_IP=$(echo "${{ env.PRIVATE_IP }}" | cut -d',' -f1)
          for i in $(seq 1 10); do
            ssh -i ~/.ssh/prod.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/prod.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.PROD_BASTION_HOST }}" \
              ec2-user@${FIRST_IP} "echo OK" 2>/dev/null && break
            echo "⏳ $i/10..."; sleep 15
          done

      - name: Deploy ${{ matrix.name }} via SSH
        if: matrix.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          sync: true
          proxy_host: ${{ secrets.PROD_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_KEY }}
          proxy_port: 22
          envs: AUTH_PRIVATE_IP,USER_PRIVATE_IP,VEHICLE_PRIVATE_IP,PARKING_PRIVATE_IP,RESERVATION_PRIVATE_IP,PAYMENT_PRIVATE_IP,NOTIFICATION_PRIVATE_IP,AUDIT_PRIVATE_IP,REALTIME_PRIVATE_IP,AI_PRIVATE_IP,PROD_GATEWAY_URL,PROD_FRONTEND_URL
          script: |
            set -euo pipefail

            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            ENV_FILE="/opt/smartparking/.env"
            sudo mkdir -p /opt/smartparking
            sudo chown ec2-user:ec2-user /opt/smartparking
            touch "$ENV_FILE" && chmod 644 "$ENV_FILE"

            patch_env() {
              local key="$1" val="$2"
              if [ -z "$val" ] || [ "$val" = "None" ] || [ "$val" = "null" ]; then
                echo "❌ Valor vacío para $key"; exit 1
              fi
              sudo sed -i "/^${key}=/d" "$ENV_FILE"
              printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              echo "  ✔ $key"
            }

            patch_env DOCKERHUB_USER       "${{ secrets.DOCKERHUB_USERNAME }}"
            patch_env JWT_SECRET           "${{ secrets.PROD_JWT_SECRET }}"
            patch_env JWT_REFRESH_SECRET   "${{ secrets.PROD_JWT_REFRESH_SECRET }}"
            patch_env INTERNAL_SERVICE_KEY "${{ secrets.PROD_INTERNAL_SERVICE_KEY }}"
            patch_env CORS_ORIGINS         "${{ secrets.PROD_FRONTEND_URL }},${{ secrets.PROD_GATEWAY_URL }}"
            patch_env APP_IMAGE "${{ secrets.DOCKERHUB_USERNAME }}/smartparking-${{ matrix.image_suffix }}:prod"
            patch_env APP_PORT  "${{ matrix.app_port }}"

            if [ "${{ matrix.name }}" = "auth" ]; then
              patch_env PORT              "3000"
              patch_env DATABASE_URL      "postgresql://admin:admin@postgres:5432/smartparking"
              patch_env REDIS_URL         "redis://redis:6379"
              patch_env FRONTEND_URL      "${{ secrets.PROD_FRONTEND_URL }}"
              patch_env USER_SERVICE_URL  "http://${USER_PRIVATE_IP}:3001/api"
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              patch_env USER_SERVICE_PORT "3001"
              patch_env USER_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/userdb"
              patch_env REDIS_URL         "redis://${AUTH_PRIVATE_IP}:6379"
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              patch_env VEHICLE_SERVICE_PORT "3003"
              patch_env VEHICLE_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/vehicledb"
              patch_env REDIS_URL            "redis://${AUTH_PRIVATE_IP}:6379"
            fi

            if [ "${{ matrix.name }}" = "gateway" ]; then
              patch_env GATEWAY_PORT            "3006"
              patch_env REDIS_URL               "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env AUTH_SERVICE_URL        "http://${AUTH_PRIVATE_IP}:3000"
              patch_env USER_SERVICE_URL        "http://${USER_PRIVATE_IP}:3001"
              patch_env VEHICLE_SERVICE_URL     "http://${VEHICLE_PRIVATE_IP}:3003"
              patch_env PARKING_SERVICE_URL     "http://${PARKING_PRIVATE_IP}:3004"
              patch_env RESERVATION_SERVICE_URL "http://${RESERVATION_PRIVATE_IP}:3005"
              patch_env PAYMENT_SERVICE_URL     "http://${PAYMENT_PRIVATE_IP}:3007"
              patch_env NOTIFICATION_SERVICE_URL "http://${NOTIFICATION_PRIVATE_IP}:3011"
              patch_env REALTIME_SERVICE_URL    "http://${REALTIME_PRIVATE_IP}:3008"
              patch_env AUDIT_SERVICE_URL       "http://${AUDIT_PRIVATE_IP}:3012"
              patch_env AI_SERVICE_URL          "http://${AI_PRIVATE_IP}:3009"
              patch_env THROTTLE_TTL            "60000"
              patch_env THROTTLE_LIMIT          "200"
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              patch_env PARKING_SERVICE_PORT "3004"
              patch_env PARKING_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/parkingdb"
              patch_env REDIS_URL            "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS        "${AUTH_PRIVATE_IP}:9092"
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              patch_env RESERVATION_SERVICE_PORT   "3005"
              patch_env RESERVATION_DATABASE_URL   "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/reservationdb"
              patch_env REDIS_URL                  "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS              "${AUTH_PRIVATE_IP}:9092"
              patch_env PARKING_SERVICE_URL        "http://${PARKING_PRIVATE_IP}:3004"
              patch_env USER_SERVICE_URL           "http://${USER_PRIVATE_IP}:3001/api"
              patch_env VEHICLE_SERVICE_URL        "http://${VEHICLE_PRIVATE_IP}:3003"
              patch_env RESERVATION_EXPIRY_MINUTES "15"
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              patch_env PAYMENT_SERVICE_PORT    "3007"
              patch_env PAYMENT_DATABASE_URL    "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/paymentdb"
              patch_env REDIS_URL               "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env RABBITMQ_URL            "amqp://guest:guest@${AUTH_PRIVATE_IP}:5672"
              patch_env KAFKA_BROKERS           "${AUTH_PRIVATE_IP}:9092"
              patch_env RESERVATION_SERVICE_URL "http://${RESERVATION_PRIVATE_IP}:3005"
              patch_env USER_SERVICE_URL        "http://${USER_PRIVATE_IP}:3001/api"
              patch_env STRIPE_SECRET_KEY       "${{ secrets.STRIPE_SECRET_KEY }}"
              patch_env STRIPE_PUBLIC_KEY       "${{ secrets.STRIPE_PUBLIC_KEY }}"
              patch_env STRIPE_WEBHOOK_SECRET   "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            fi

            if [ "${{ matrix.name }}" = "realtime" ]; then
              patch_env REALTIME_SERVICE_PORT "3008"
              patch_env REDIS_URL             "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS         "${AUTH_PRIVATE_IP}:9092"
            fi

            if [ "${{ matrix.name }}" = "notification" ]; then
              patch_env NOTIFICATION_SERVICE_PORT "3011"
              patch_env REDIS_URL                 "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS             "${AUTH_PRIVATE_IP}:9092"
              patch_env RABBITMQ_URL              "amqp://guest:guest@${AUTH_PRIVATE_IP}:5672"
              patch_env AUTH_SERVICE_URL          "http://${AUTH_PRIVATE_IP}:3000"
              patch_env PARKING_SERVICE_URL       "http://${PARKING_PRIVATE_IP}:3004"
              patch_env RESERVATION_SERVICE_URL   "http://${RESERVATION_PRIVATE_IP}:3005"
              patch_env EMAILJS_SERVICE_ID   "${{ secrets.EMAILJS_SERVICE_ID }}"
              patch_env EMAILJS_TEMPLATE_ID  "${{ secrets.EMAILJS_TEMPLATE_ID }}"
              patch_env EMAILJS_PUBLIC_KEY   "${{ secrets.EMAILJS_PUBLIC_KEY }}"
              patch_env EMAILJS_PRIVATE_KEY  "${{ secrets.EMAILJS_PRIVATE_KEY }}"
            fi

            if [ "${{ matrix.name }}" = "audit" ]; then
              patch_env AUDIT_SERVICE_PORT    "3012"
              patch_env AUDIT_DATABASE_URL    "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/auditdb"
              patch_env REDIS_URL             "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS         "${AUTH_PRIVATE_IP}:9092"
            fi

            if [ "${{ matrix.name }}" = "ai" ]; then
              patch_env AI_SERVICE_PORT     "3009"
              patch_env AI_DATABASE_URL     "mongodb://${AUTH_PRIVATE_IP}:27017/aidb"
              patch_env SEARCH_SERVICE_URL  "http://search-service.prod.internal:3010"
              patch_env PARKING_SERVICE_URL "http://${PARKING_PRIVATE_IP}:3004"
              patch_env KAFKA_BROKERS       "${AUTH_PRIVATE_IP}:9092"
            fi

            if [ "${{ matrix.name }}" = "frontend" ]; then
              patch_env PORT "3002"
              patch_env NEXT_PUBLIC_GATEWAY_URL "$PROD_GATEWAY_URL"
            fi

            echo "🧹 Liberando espacio en disco antes del pull..."
            df -h / || true
            docker image prune -af --filter "until=24h" || true
            docker builder prune -af || true
            df -h / || true

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker-compose -f "$COMPOSE_FILE" pull ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" up -d --force-recreate ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" ps

            reset_db_schema() {
              local db="$1"
              docker run --rm -e PGPASSWORD=admin -e PGCONNECT_TIMEOUT=5 postgres:16 \
                psql -h "${AUTH_PRIVATE_IP}" -U admin -d "$db" -v ON_ERROR_STOP=1 -c \
                "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO admin; GRANT ALL ON SCHEMA public TO public;"
            }

            if [ "${{ matrix.name }}" = "auth" ]; then
              echo "⏳ Esperando PostgreSQL..."
              pg_container=$(docker-compose -f "$COMPOSE_FILE" ps -q postgres)
              for i in {1..30}; do
                if docker exec "$pg_container" pg_isready -U admin -d smartparking &>/dev/null; then
                  break
                fi
                sleep 2
              done

              for db in userdb vehicledb parkingdb reservationdb paymentdb auditdb; do
                if ! docker exec "$pg_container" psql -U admin -d smartparking -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" 2>/dev/null | grep -q 1; then
                  docker exec "$pg_container" psql -U admin -d smartparking -c "CREATE DATABASE ${db};" 2>/dev/null || true
                fi
                echo "  ✔ ${db}"
              done

              echo "Cleaning up invalid failed migrations on smartparking DB..."
              docker exec "$pg_container" psql -U admin -d smartparking -c "DELETE FROM _prisma_migrations WHERE migration_name = '20260601120000_init_vehicle';" 2>/dev/null || true

              echo "Running auth migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T auth-service \
                npx prisma migrate deploy --schema prisma/auth/schema.prisma
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              echo "Running user migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e USER_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/userdb" \
                app npx prisma migrate deploy --config prisma.user.config.ts
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              echo "Resolving vehicle init migration if failed in vehicledb..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e VEHICLE_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/vehicledb" \
                app npx prisma migrate resolve --rolled-back 20260601120000_init_vehicle --config prisma.vehicle.config.ts || true

              echo "Running vehicle migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e VEHICLE_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/vehicledb" \
                app npx prisma migrate deploy --config prisma.vehicle.config.ts
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              echo "Resetting parkingdb schema..."
              reset_db_schema parkingdb
              echo "Running parking migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PARKING_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/parkingdb" \
                app npx prisma migrate deploy --config prisma.parking.config.ts
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              if ! swapon --show 2>/dev/null | grep -q /swapfile; then
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
                sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
              fi
              echo "Deteniendo app para liberar RAM antes de migrar..."
              docker-compose -f "$COMPOSE_FILE" stop app
              echo "Running reservation migrations..."
              docker-compose -f "$COMPOSE_FILE" run --rm \
                -e RESERVATION_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/reservationdb" \
                app npx prisma migrate deploy --config prisma.reservation.config.ts
              echo "Reiniciando app..."
              docker-compose -f "$COMPOSE_FILE" up -d app
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              if ! swapon --show 2>/dev/null | grep -q /swapfile; then
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
                sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
              fi
              echo "Resetting paymentdb schema..."
              reset_db_schema paymentdb
              echo "Running payment migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PAYMENT_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/paymentdb" \
                app npx prisma migrate deploy --config prisma.payment.config.ts
            fi

            if [ "${{ matrix.name }}" = "audit" ]; then
              echo "Resetting auditdb schema..."
              reset_db_schema auditdb
              echo "Running audit migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e AUDIT_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/auditdb" \
                app npx prisma migrate deploy --config prisma.audit.config.ts
            fi

            echo "✅ ${{ matrix.name }} deployado exitosamente."
