name: PROD CI/CD

on:
  push:
    branches: [PROD, prod]
  pull_request:
    types: [closed]
    branches: [PROD, prod]
  workflow_dispatch:

concurrency:
  group: prod-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker-push:
    name: Build & Push to Docker Hub
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod

    env:
      PROD_AUTH_API_URL: ${{ vars.PROD_AUTH_API_URL || secrets.PROD_AUTH_API_URL }}
      PROD_USER_API_URL: ${{ vars.PROD_USER_API_URL || secrets.PROD_USER_API_URL }}
      PROD_VEHICLE_API_URL: ${{ vars.PROD_VEHICLE_API_URL || secrets.PROD_VEHICLE_API_URL }}
      PROD_PARKING_API_URL: ${{ vars.PROD_PARKING_API_URL || secrets.PROD_PARKING_API_URL }}
      PROD_RESERVATION_API_URL: ${{ vars.PROD_RESERVATION_API_URL || secrets.PROD_RESERVATION_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify PROD API URLs (frontend build)
        run: |
          missing=0
          for name in PROD_AUTH_API_URL PROD_USER_API_URL PROD_VEHICLE_API_URL PROD_PARKING_API_URL PROD_RESERVATION_API_URL; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing $name — set in GitHub Environment prod → Variables"
              missing=1
            else
              echo "$name=$val"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/auth-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-auth:prod

      - name: Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/user-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-user:prod

      - name: Push vehicle-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/vehicle-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-vehicle:prod

      - name: Push gateway-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/gateway-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-gateway:prod

      - name: Push parking-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/parking-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-parking:prod

      - name: Push reservation-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/reservation-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-reservation:prod

      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking/apps/frontend
          file: ./smart-parking/apps/frontend/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-frontend:prod
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=${{ env.PROD_AUTH_API_URL }}
            NEXT_PUBLIC_USER_API_URL=${{ env.PROD_USER_API_URL }}
            NEXT_PUBLIC_VEHICLE_API_URL=${{ env.PROD_VEHICLE_API_URL }}
            NEXT_PUBLIC_PARKING_API_URL=${{ env.PROD_PARKING_API_URL }}
            NEXT_PUBLIC_RESERVATION_API_URL=${{ env.PROD_RESERVATION_API_URL }}

  deploy:
    name: Deploy on EC2 instances
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: docker-push
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            host_secret: PROD_EC2_AUTH_HOST
            service_name: auth-service
          - name: user
            host_secret: PROD_EC2_USER_HOST
            service_name: app
          - name: vehicle
            host_secret: PROD_EC2_VEHICLE_HOST
            service_name: app
          - name: frontend
            host_secret: PROD_EC2_FRONTEND_HOST
            service_name: app
          - name: gateway
            host_secret: PROD_EC2_GATEWAY_HOST
            service_name: app
          - name: parking
            host_secret: PROD_EC2_PARKING_HOST
            service_name: app
          - name: reservation
            host_secret: PROD_EC2_RESERVATION_HOST
            service_name: app
    steps:
      - name: Deploy ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          script: |
            export DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            cd /opt/smartparking
            patch_env() {
              key="$1"
              val="$2"
              env_file="/opt/smartparking/.env"
              if sudo grep -q "^${key}=" "$env_file" 2>/dev/null; then
                sudo sed -i "s|^${key}=.*|${key}=${val}|" "$env_file"
              else
                echo "${key}=${val}" | sudo tee -a "$env_file" > /dev/null
              fi
            }
            CORS_LIST="http://${{ secrets.PROD_EC2_FRONTEND_HOST }}:3002,http://${{ secrets.PROD_EC2_AUTH_HOST }}:3000,http://${{ secrets.PROD_EC2_USER_HOST }}:3001,http://${{ secrets.PROD_EC2_VEHICLE_HOST }}:3003,http://${{ secrets.PROD_EC2_GATEWAY_HOST }}:3006,http://${{ secrets.PROD_EC2_PARKING_HOST }}:3004,http://${{ secrets.PROD_EC2_RESERVATION_HOST }}:3005"
            
            # Dynamic configurations based on node roles
            if [ "${{ matrix.name }}" = "auth" ]; then
              patch_env USER_SERVICE_URL "http://${{ secrets.PROD_EC2_USER_HOST }}:3001"
              patch_env FRONTEND_URL "http://${{ secrets.PROD_EC2_FRONTEND_HOST }}:3002"
              patch_env CORS_ORIGINS "$CORS_LIST"
            fi
            
            if [ "${{ matrix.name }}" = "user" ] || [ "${{ matrix.name }}" = "vehicle" ]; then
              patch_env USER_DATABASE_URL "postgresql://admin:admin@${{ secrets.PROD_EC2_AUTH_HOST }}:5432/userdb"
              patch_env VEHICLE_DATABASE_URL "postgresql://admin:admin@${{ secrets.PROD_EC2_AUTH_HOST }}:5432/vehicledb"
              patch_env REDIS_URL "redis://${{ secrets.PROD_EC2_AUTH_HOST }}:6379"
              patch_env CORS_ORIGINS "$CORS_LIST"
            fi

            if [ "${{ matrix.name }}" = "gateway" ]; then
              patch_env REDIS_URL "redis://${{ secrets.PROD_EC2_AUTH_HOST }}:6379"
              patch_env AUTH_SERVICE_URL "http://${{ secrets.PROD_EC2_AUTH_HOST }}:3000"
              patch_env USER_SERVICE_URL "http://${{ secrets.PROD_EC2_USER_HOST }}:3001"
              patch_env VEHICLE_SERVICE_URL "http://${{ secrets.PROD_EC2_VEHICLE_HOST }}:3003"
              patch_env PARKING_SERVICE_URL "http://${{ secrets.PROD_EC2_PARKING_HOST }}:3004"
              patch_env RESERVATION_SERVICE_URL "http://${{ secrets.PROD_EC2_RESERVATION_HOST }}:3005"
              patch_env CORS_ORIGINS "$CORS_LIST"
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              patch_env PARKING_DATABASE_URL "postgresql://admin:admin@${{ secrets.PROD_EC2_AUTH_HOST }}:5432/parkingdb"
              patch_env REDIS_URL "redis://${{ secrets.PROD_EC2_AUTH_HOST }}:6379"
              patch_env KAFKA_BROKERS "${{ secrets.PROD_EC2_AUTH_HOST }}:9092"
              patch_env CORS_ORIGINS "$CORS_LIST"
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              patch_env RESERVATION_DATABASE_URL "postgresql://admin:admin@${{ secrets.PROD_EC2_AUTH_HOST }}:5432/reservationdb"
              patch_env REDIS_URL "redis://${{ secrets.PROD_EC2_AUTH_HOST }}:6379"
              patch_env KAFKA_BROKERS "${{ secrets.PROD_EC2_AUTH_HOST }}:9092"
              patch_env PARKING_SERVICE_URL "http://${{ secrets.PROD_EC2_PARKING_HOST }}:3004"
              patch_env USER_SERVICE_URL "http://${{ secrets.PROD_EC2_USER_HOST }}:3001"
              patch_env VEHICLE_SERVICE_URL "http://${{ secrets.PROD_EC2_VEHICLE_HOST }}:3003"
              patch_env CORS_ORIGINS "$CORS_LIST"
            fi

            if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USER:-}" ]; then
              echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin
            fi
            /usr/local/bin/docker-compose pull
            /usr/local/bin/docker-compose up -d --force-recreate ${{ matrix.service_name }}
            /usr/local/bin/docker-compose ps
