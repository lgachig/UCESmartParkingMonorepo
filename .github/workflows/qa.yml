name: QA CI/CD

on:
  push:
    branches: [feature/USP-096-infrastructure-frontend-integration]
  pull_request:
    types: [closed]
    branches: [feature/USP-096-infrastructure-frontend-integration]
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all services regardless of file changes'
        type: boolean
        default: true

concurrency:
  group: qa-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-check:
    uses: ./.github/workflows/ci.yml

  get-changes:
    name: Read Changed Services
    needs: [ci-check]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      auth:        ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.auth == 'true' }}
      user:        ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.user == 'true' }}
      vehicle:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.vehicle == 'true' }}
      parking:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.parking == 'true' }}
      reservation: ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.reservation == 'true' }}
      gateway:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.gateway == 'true' }}
      frontend:    ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.frontend == 'true' }}
      payment:     ${{ github.event_name == 'workflow_dispatch' || needs.ci-check.outputs.infra == 'true' || needs.ci-check.outputs.payment == 'true' }}
    steps:
      - name: Echo changes
        run: |
          echo "auth=${{ needs.ci-check.outputs.auth }}"
          echo "user=${{ needs.ci-check.outputs.user }}"
          echo "vehicle=${{ needs.ci-check.outputs.vehicle }}"
          echo "parking=${{ needs.ci-check.outputs.parking }}"
          echo "reservation=${{ needs.ci-check.outputs.reservation }}"
          echo "gateway=${{ needs.ci-check.outputs.gateway }}"
          echo "frontend=${{ needs.ci-check.outputs.frontend }}"
          echo "payment=${{ needs.ci-check.outputs.payment }}"

  docker-push:
    name: Build & Push (${{ matrix.name }})
    needs: [get-changes]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_GATEWAY_URL: ${{ secrets.QA_GATEWAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            changed: ${{ needs.get-changes.outputs.auth }}
            dockerfile: smart-parking/apps/auth-service/dockerfile
            context: ./smart-parking
            image_suffix: auth
          - name: user
            changed: ${{ needs.get-changes.outputs.user }}
            dockerfile: smart-parking/apps/user-service/dockerfile
            context: ./smart-parking
            image_suffix: user
          - name: vehicle
            changed: ${{ needs.get-changes.outputs.vehicle }}
            dockerfile: smart-parking/apps/vehicle-service/dockerfile
            context: ./smart-parking
            image_suffix: vehicle
          - name: gateway
            changed: ${{ needs.get-changes.outputs.gateway }}
            dockerfile: smart-parking/apps/gateway-service/dockerfile
            context: ./smart-parking
            image_suffix: gateway
          - name: parking
            changed: ${{ needs.get-changes.outputs.parking }}
            dockerfile: smart-parking/apps/parking-service/dockerfile
            context: ./smart-parking
            image_suffix: parking
          - name: reservation
            changed: ${{ needs.get-changes.outputs.reservation }}
            dockerfile: smart-parking/apps/reservation-service/dockerfile
            context: ./smart-parking
            image_suffix: reservation
          - name: frontend
            changed: ${{ needs.get-changes.outputs.frontend }}
            dockerfile: smart-parking/apps/frontend/dockerfile
            context: ./smart-parking/apps/frontend
            image_suffix: frontend
          - name: payment
            changed: ${{ needs.get-changes.outputs.payment }}
            dockerfile: smart-parking/apps/payment-service/dockerfile
            context: ./smart-parking
            image_suffix: payment

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }} — sin cambios."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - uses: docker/setup-buildx-action@v3
        if: matrix.changed == 'true'

      - uses: docker/login-action@v3
        if: matrix.changed == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        if: matrix.changed == 'true' && matrix.name != 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-${{ matrix.image_suffix }}:qa

      - name: Verify QA_GATEWAY_URL
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        run: |
          if [ -z "$QA_GATEWAY_URL" ]; then
            echo "::error::Falta QA_GATEWAY_URL — configúrala en GitHub Environments qa"
            exit 1
          fi

      - name: Push frontend
        if: matrix.changed == 'true' && matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-frontend:qa
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ env.QA_GATEWAY_URL }}

  discover-ips:
    name: Discover Private IPs
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [docker-push]
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      auth_ip:        ${{ steps.ips.outputs.auth_ip }}
      user_ip:        ${{ steps.ips.outputs.user_ip }}
      vehicle_ip:     ${{ steps.ips.outputs.vehicle_ip }}
      parking_ip:     ${{ steps.ips.outputs.parking_ip }}
      reservation_ip: ${{ steps.ips.outputs.reservation_ip }}
      gateway_ip:     ${{ steps.ips.outputs.gateway_ip }}
      frontend_ip:    ${{ steps.ips.outputs.frontend_ip }}
      payment_ip:     ${{ steps.ips.outputs.payment_ip }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get IPs
        id: ips
        run: |
          get_ip() {
            local svc="$1"
            local ip
            ip=$(aws ec2 describe-instances \
              --filters "Name=tag:Service,Values=${svc}" "Name=tag:Environment,Values=qa" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" --output text 2>/dev/null)
            if [ -z "$ip" ] || [ "$ip" = "None" ] || [ "$ip" = "null" ]; then
              echo "::error::No EC2 running for Service=${svc}"; return 1
            fi
            echo "$ip"
          }
          AUTH_IP=$(get_ip "auth")               || exit 1
          USER_IP=$(get_ip "user")               || exit 1
          VEHICLE_IP=$(get_ip "vehicle")         || exit 1
          PARKING_IP=$(get_ip "parking")         || exit 1
          RESERVATION_IP=$(get_ip "reservation") || exit 1
          GATEWAY_IP=$(get_ip "gateway")         || exit 1
          FRONTEND_IP=$(get_ip "frontend")       || exit 1
          PAYMENT_IP=$(get_ip "payment")         || exit 1

          echo "auth_ip=$AUTH_IP"               >> $GITHUB_OUTPUT
          echo "user_ip=$USER_IP"               >> $GITHUB_OUTPUT
          echo "vehicle_ip=$VEHICLE_IP"         >> $GITHUB_OUTPUT
          echo "parking_ip=$PARKING_IP"         >> $GITHUB_OUTPUT
          echo "reservation_ip=$RESERVATION_IP" >> $GITHUB_OUTPUT
          echo "gateway_ip=$GATEWAY_IP"         >> $GITHUB_OUTPUT
          echo "frontend_ip=$FRONTEND_IP"       >> $GITHUB_OUTPUT
          echo "payment_ip=$PAYMENT_IP"         >> $GITHUB_OUTPUT

          echo "auth=$AUTH_IP | user=$USER_IP | vehicle=$VEHICLE_IP | parking=$PARKING_IP | reservation=$RESERVATION_IP | gateway=$GATEWAY_IP | frontend=$FRONTEND_IP | payment=$PAYMENT_IP"

  deploy:
    name: Deploy ${{ matrix.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: [get-changes, discover-ips]
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_GATEWAY_URL: ${{ secrets.QA_GATEWAY_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            service_name: auth-service
            image_suffix: auth
            app_port: '3000'
            changed: ${{ needs.get-changes.outputs.auth }}
          - name: user
            service_name: app
            image_suffix: user
            app_port: '3001'
            changed: ${{ needs.get-changes.outputs.user }}
          - name: vehicle
            service_name: app
            image_suffix: vehicle
            app_port: '3003'
            changed: ${{ needs.get-changes.outputs.vehicle }}
          - name: gateway
            service_name: app
            image_suffix: gateway
            app_port: '3006'
            changed: ${{ needs.get-changes.outputs.gateway }}
          - name: parking
            service_name: app
            image_suffix: parking
            app_port: '3004'
            changed: ${{ needs.get-changes.outputs.parking }}
          - name: reservation
            service_name: app
            image_suffix: reservation
            app_port: '3005'
            changed: ${{ needs.get-changes.outputs.reservation }}
          - name: frontend
            service_name: app
            image_suffix: frontend
            app_port: '3002'
            changed: ${{ needs.get-changes.outputs.frontend }}
          - name: payment
            service_name: app
            image_suffix: payment
            app_port: '3007'
            changed: ${{ needs.get-changes.outputs.payment }}

    steps:
      - name: Skip if unchanged
        if: matrix.changed != 'true'
        run: echo "Skip ${{ matrix.name }}."

      - name: Load IPs
        if: matrix.changed == 'true'
        run: |
          echo "AUTH_PRIVATE_IP=${{ needs.discover-ips.outputs.auth_ip }}"               >> $GITHUB_ENV
          echo "USER_PRIVATE_IP=${{ needs.discover-ips.outputs.user_ip }}"               >> $GITHUB_ENV
          echo "VEHICLE_PRIVATE_IP=${{ needs.discover-ips.outputs.vehicle_ip }}"         >> $GITHUB_ENV
          echo "PARKING_PRIVATE_IP=${{ needs.discover-ips.outputs.parking_ip }}"         >> $GITHUB_ENV
          echo "RESERVATION_PRIVATE_IP=${{ needs.discover-ips.outputs.reservation_ip }}" >> $GITHUB_ENV
          echo "GATEWAY_PRIVATE_IP=${{ needs.discover-ips.outputs.gateway_ip }}"         >> $GITHUB_ENV
          echo "FRONTEND_PRIVATE_IP=${{ needs.discover-ips.outputs.frontend_ip }}"       >> $GITHUB_ENV
          echo "PAYMENT_PRIVATE_IP=${{ needs.discover-ips.outputs.payment_ip }}"         >> $GITHUB_ENV

      - name: Resolve target IP
        if: matrix.changed == 'true'
        run: |
          case "${{ matrix.name }}" in
            auth)        echo "PRIVATE_IP=${{ needs.discover-ips.outputs.auth_ip }}"        >> $GITHUB_ENV ;;
            user)        echo "PRIVATE_IP=${{ needs.discover-ips.outputs.user_ip }}"        >> $GITHUB_ENV ;;
            vehicle)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.vehicle_ip }}"     >> $GITHUB_ENV ;;
            parking)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.parking_ip }}"     >> $GITHUB_ENV ;;
            reservation) echo "PRIVATE_IP=${{ needs.discover-ips.outputs.reservation_ip }}" >> $GITHUB_ENV ;;
            gateway)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.gateway_ip }}"     >> $GITHUB_ENV ;;
            frontend)    echo "PRIVATE_IP=${{ needs.discover-ips.outputs.frontend_ip }}"    >> $GITHUB_ENV ;;
            payment)     echo "PRIVATE_IP=${{ needs.discover-ips.outputs.payment_ip }}"     >> $GITHUB_ENV ;;
          esac

      - name: Setup SSH
        if: matrix.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_EC2_SSH_KEY }}" > ~/.ssh/qa.pem
          chmod 400 ~/.ssh/qa.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Wait SSH
        if: matrix.changed == 'true'
        run: |
          for i in $(seq 1 10); do
            ssh -i ~/.ssh/qa.pem -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/qa.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.QA_BASTION_HOST }}" \
              ec2-user@${{ env.PRIVATE_IP }} "echo OK" 2>/dev/null && break
            echo "⏳ $i/10..."; sleep 15
          done

      - name: Deploy ${{ matrix.name }} via SSH
        if: matrix.changed == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.QA_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          proxy_host: ${{ secrets.QA_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.QA_EC2_SSH_KEY }}
          proxy_port: 22
          envs: AUTH_PRIVATE_IP,USER_PRIVATE_IP,VEHICLE_PRIVATE_IP,PARKING_PRIVATE_IP,RESERVATION_PRIVATE_IP,GATEWAY_PRIVATE_IP,FRONTEND_PRIVATE_IP,PAYMENT_PRIVATE_IP,QA_GATEWAY_URL
          script: |
            set -euo pipefail

            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            ENV_FILE="/opt/smartparking/.env"
            sudo mkdir -p /opt/smartparking
            sudo chown ec2-user:ec2-user /opt/smartparking
            touch "$ENV_FILE" && chmod 644 "$ENV_FILE"

            patch_env() {
              local key="$1" val="$2"
              if [ -z "$val" ] || [ "$val" = "None" ] || [ "$val" = "null" ]; then
                echo "❌ Valor vacío para $key"; exit 1
              fi
              sudo sed -i "/^${key}=/d" "$ENV_FILE"
              printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              echo "  ✔ $key"
            }

            patch_env DOCKERHUB_USER       "${{ secrets.DOCKERHUB_USERNAME }}"
            patch_env JWT_SECRET           "${{ secrets.QA_JWT_SECRET }}"
            patch_env JWT_REFRESH_SECRET   "${{ secrets.QA_JWT_REFRESH_SECRET }}"
            patch_env INTERNAL_SERVICE_KEY "${{ secrets.QA_INTERNAL_SERVICE_KEY }}"
            patch_env CORS_ORIGINS         "http://${{ secrets.QA_FRONTEND_EIP }}:3002,http://${{ secrets.QA_GATEWAY_EIP }}:3006"
            patch_env APP_IMAGE "${{ secrets.DOCKERHUB_USERNAME }}/smartparking-${{ matrix.image_suffix }}:qa"
            patch_env APP_PORT  "${{ matrix.app_port }}"

            if [ "${{ matrix.name }}" = "auth" ]; then
              patch_env PORT              "3000"
              patch_env DATABASE_URL      "postgresql://admin:admin@postgres:5432/smartparking"
              patch_env REDIS_URL         "redis://redis:6379"
              patch_env FRONTEND_URL      "http://${{ secrets.QA_FRONTEND_EIP }}:3002"
              patch_env USER_SERVICE_URL  "http://${USER_PRIVATE_IP}:3001/api"
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              patch_env USER_SERVICE_PORT "3001"
              patch_env USER_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/userdb"
              patch_env REDIS_URL         "redis://${AUTH_PRIVATE_IP}:6379"
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              patch_env VEHICLE_SERVICE_PORT "3003"
              patch_env VEHICLE_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/vehicledb"
              patch_env REDIS_URL            "redis://${AUTH_PRIVATE_IP}:6379"
            fi

            if [ "${{ matrix.name }}" = "gateway" ]; then
              patch_env GATEWAY_PORT            "3006"
              patch_env REDIS_URL               "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env AUTH_SERVICE_URL        "http://${AUTH_PRIVATE_IP}:3000"
              patch_env USER_SERVICE_URL        "http://${USER_PRIVATE_IP}:3001"
              patch_env VEHICLE_SERVICE_URL     "http://${VEHICLE_PRIVATE_IP}:3003"
              patch_env PARKING_SERVICE_URL     "http://${PARKING_PRIVATE_IP}:3004"
              patch_env RESERVATION_SERVICE_URL "http://${RESERVATION_PRIVATE_IP}:3005"
              patch_env PAYMENT_SERVICE_URL     "http://${PAYMENT_PRIVATE_IP}:3007"
              patch_env THROTTLE_TTL            "60000"
              patch_env THROTTLE_LIMIT          "60"
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              patch_env PARKING_SERVICE_PORT "3004"
              patch_env PARKING_DATABASE_URL "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/parkingdb"
              patch_env REDIS_URL            "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS        "${AUTH_PRIVATE_IP}:9092"
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              patch_env RESERVATION_SERVICE_PORT   "3005"
              patch_env RESERVATION_DATABASE_URL   "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/reservationdb"
              patch_env REDIS_URL                  "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env KAFKA_BROKERS              "${AUTH_PRIVATE_IP}:9092"
              patch_env PARKING_SERVICE_URL        "http://${PARKING_PRIVATE_IP}:3004"
              patch_env USER_SERVICE_URL           "http://${USER_PRIVATE_IP}:3001/api"
              patch_env VEHICLE_SERVICE_URL        "http://${VEHICLE_PRIVATE_IP}:3003"
              patch_env RESERVATION_EXPIRY_MINUTES "15"
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              patch_env PAYMENT_SERVICE_PORT    "3007"
              patch_env PAYMENT_DATABASE_URL    "postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/paymentdb"
              patch_env REDIS_URL               "redis://${AUTH_PRIVATE_IP}:6379"
              patch_env RABBITMQ_URL            "amqp://guest:guest@${AUTH_PRIVATE_IP}:5672"
              patch_env KAFKA_BROKERS           "${AUTH_PRIVATE_IP}:9092"
              patch_env RESERVATION_SERVICE_URL "http://${RESERVATION_PRIVATE_IP}:3005"
              patch_env USER_SERVICE_URL        "http://${USER_PRIVATE_IP}:3001/api"
              patch_env STRIPE_SECRET_KEY       "${{ secrets.STRIPE_SECRET_KEY }}"
              patch_env STRIPE_PUBLIC_KEY       "${{ secrets.STRIPE_PUBLIC_KEY }}"
              patch_env STRIPE_WEBHOOK_SECRET   "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            fi

            if [ "${{ matrix.name }}" = "frontend" ]; then
              patch_env PORT "3002"
              patch_env NEXT_PUBLIC_GATEWAY_URL "$QA_GATEWAY_URL"
            fi

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker-compose -f "$COMPOSE_FILE" pull ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" up -d --force-recreate ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" ps

            reset_db_schema() {
              local db="$1"
              docker run --rm -e PGPASSWORD=admin -e PGCONNECT_TIMEOUT=5 postgres:16 \
                psql -h "${AUTH_PRIVATE_IP}" -U admin -d "$db" -v ON_ERROR_STOP=1 -c \
                "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO admin; GRANT ALL ON SCHEMA public TO public;"
            }

            if [ "${{ matrix.name }}" = "auth" ]; then
              echo "⏳ Esperando PostgreSQL..."
              pg_container=$(docker-compose -f "$COMPOSE_FILE" ps -q postgres)
              for i in {1..30}; do
                if docker exec "$pg_container" pg_isready -U admin -d smartparking &>/dev/null; then
                  break
                fi
                sleep 2
              done

              for db in userdb vehicledb parkingdb reservationdb paymentdb; do
                if ! docker exec "$pg_container" psql -U admin -d smartparking -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" 2>/dev/null | grep -q 1; then
                  docker exec "$pg_container" psql -U admin -d smartparking -c "CREATE DATABASE ${db};" 2>/dev/null || true
                fi
                echo "  ✔ ${db}"
              done

              echo "Cleaning up invalid failed migrations on smartparking DB..."
              docker exec "$pg_container" psql -U admin -d smartparking -c "DELETE FROM _prisma_migrations WHERE migration_name = '20260601120000_init_vehicle';" 2>/dev/null || true

              echo "Running auth migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T auth-service \
                npx prisma migrate deploy --schema prisma/auth/schema.prisma
            fi

            if [ "${{ matrix.name }}" = "user" ]; then
              echo "Running user migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T app \
                npx prisma migrate deploy --config prisma.user.config.ts
            fi

            if [ "${{ matrix.name }}" = "vehicle" ]; then
              echo "Resolving vehicle init migration if failed in vehicledb..."
              docker-compose -f "$COMPOSE_FILE" exec -T app \
                npx prisma migrate resolve --rolled-back 20260601120000_init_vehicle --config prisma.vehicle.config.ts || true

              echo "Running vehicle migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T app \
                npx prisma migrate deploy --config prisma.vehicle.config.ts
            fi

            if [ "${{ matrix.name }}" = "parking" ]; then
              echo "Resetting parkingdb schema..."
              reset_db_schema parkingdb
              echo "Running parking migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PARKING_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/parkingdb" \
                app npx prisma migrate deploy --config prisma.parking.config.ts
            fi

            if [ "${{ matrix.name }}" = "reservation" ]; then
              echo "Running reservation migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T app \
                npx prisma migrate deploy --config prisma.reservation.config.ts
            fi

            if [ "${{ matrix.name }}" = "payment" ]; then
              if ! swapon --show 2>/dev/null | grep -q /swapfile; then
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
                sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
              fi
              echo "Resetting paymentdb schema..."
              reset_db_schema paymentdb
              echo "Running payment migrations..."
              docker-compose -f "$COMPOSE_FILE" exec -T \
                -e PAYMENT_DATABASE_URL="postgresql://admin:admin@${AUTH_PRIVATE_IP}:5432/paymentdb" \
                app npx prisma migrate deploy --config prisma.payment.config.ts
            fi

            echo "✅ ${{ matrix.name }} deployado exitosamente."
