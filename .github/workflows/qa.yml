name: QA CI/CD

on:
  push:
    branches: [QA, qa]
  pull_request:
    types: [closed]
    branches: [QA, qa]
  workflow_dispatch:

concurrency:
  group: qa-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci-check:
    uses: ./.github/workflows/ci.yml

  docker-push:
    name: Build & Push to Docker Hub
    needs: [ci-check]
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_AUTH_API_URL: ${{ vars.QA_AUTH_API_URL || secrets.QA_AUTH_API_URL }}
      QA_USER_API_URL: ${{ vars.QA_USER_API_URL || secrets.QA_USER_API_URL }}
      QA_VEHICLE_API_URL: ${{ vars.QA_VEHICLE_API_URL || secrets.QA_VEHICLE_API_URL }}
      QA_PARKING_API_URL: ${{ vars.QA_PARKING_API_URL || secrets.QA_PARKING_API_URL }}
      QA_RESERVATION_API_URL: ${{ vars.QA_RESERVATION_API_URL || secrets.QA_RESERVATION_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify QA API URLs (frontend build)
        run: |
          missing=0
          for name in QA_AUTH_API_URL QA_USER_API_URL QA_VEHICLE_API_URL QA_PARKING_API_URL QA_RESERVATION_API_URL; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing $name — set in GitHub Environment qa → Variables"
              missing=1
            else
              echo "$name=$val"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/auth-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-auth:qa

      - name: Push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/user-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-user:qa

      - name: Push vehicle-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/vehicle-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-vehicle:qa

      - name: Push gateway-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/gateway-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-gateway:qa

      - name: Push parking-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/parking-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-parking:qa

      - name: Push reservation-service
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking
          file: ./smart-parking/apps/reservation-service/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-reservation:qa

      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./smart-parking/apps/frontend
          file: ./smart-parking/apps/frontend/dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/smartparking-frontend:qa
          build-args: |
            NEXT_PUBLIC_AUTH_API_URL=${{ env.QA_AUTH_API_URL }}
            NEXT_PUBLIC_USER_API_URL=${{ env.QA_USER_API_URL }}
            NEXT_PUBLIC_VEHICLE_API_URL=${{ env.QA_VEHICLE_API_URL }}
            NEXT_PUBLIC_PARKING_API_URL=${{ env.QA_PARKING_API_URL }}
            NEXT_PUBLIC_RESERVATION_API_URL=${{ env.QA_RESERVATION_API_URL }}

  deploy:
    name: Deploy via Bastion (dynamic IP discovery)
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: docker-push
    runs-on: ubuntu-latest
    environment: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            service_tag: auth
            service_name: auth-service
          - name: user
            service_tag: user
            service_name: app
          - name: vehicle
            service_tag: vehicle
            service_name: app
          - name: frontend
            service_tag: frontend
            service_name: app
          - name: gateway
            service_tag: gateway
            service_name: app
          - name: parking
            service_tag: parking
            service_name: app
          - name: reservation
            service_tag: reservation
            service_name: app

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Discover private IP of ${{ matrix.name }} instance
        id: discover
        run: |
          PRIVATE_IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Service,Values=${{ matrix.service_tag }}" \
              "Name=tag:Environment,Values=qa" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" \
            --output text)

          if [ -z "$PRIVATE_IP" ] || [ "$PRIVATE_IP" = "None" ]; then
            echo "❌ No se encontró instancia con Service=${{ matrix.service_tag }} Environment=qa"
            exit 1
          fi

          echo "✅ Instancia ${{ matrix.name }} encontrada: $PRIVATE_IP"
          echo "PRIVATE_IP=$PRIVATE_IP" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_EC2_SSH_KEY }}" > ~/.ssh/qa.pem
          chmod 400 ~/.ssh/qa.pem
          ssh-keyscan -H ${{ secrets.QA_BASTION_HOST }} >> ~/.ssh/known_hosts

      - name: Wait for SSH connectivity
        run: |
          for i in $(seq 1 10); do
            if ssh -i ~/.ssh/qa.pem \
                   -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=10 \
                   -o ProxyCommand="ssh -W %h:%p -i ~/.ssh/qa.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.QA_BASTION_HOST }}" \
                   ec2-user@${{ env.PRIVATE_IP }} "echo OK" 2>/dev/null; then
              echo "✅ SSH conectado"
              break
            fi
            echo "⏳ Intento $i/10 — esperando..."
            sleep 15
          done

      - name: Deploy ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.QA_EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script_stop: false
          proxy_host: ${{ secrets.QA_BASTION_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.QA_EC2_SSH_KEY }}
          proxy_port: 22
          script: |
            set -e
            COMPOSE_FILE="/opt/smartparking/docker-compose.yml"
            ENV_FILE="/opt/smartparking/.env"

            sudo chown ec2-user:ec2-user "$ENV_FILE" 2>/dev/null || true
            chmod 644 "$ENV_FILE" 2>/dev/null || true

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker-compose -f "$COMPOSE_FILE" pull
            docker-compose -f "$COMPOSE_FILE" up -d --force-recreate ${{ matrix.service_name }}
            docker-compose -f "$COMPOSE_FILE" ps