name: SonarQube Analysis - UCE smart-parking

on:
  push:
    branches: ["feature/sonarqube"]
  pull_request:
    branches: ["feature/sonarqube"]

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-parking
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: smart-parking/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (Nx)
        run: npx nx run-many -t test --coverage --skip-nx-cache
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: smart-parking
          args: >
            -Dsonar.sources=apps,shared
            -Dsonar.projectKey=g1-smart-parking
            -Dsonar.projectName=g1-smart-parking
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=**/coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=**/coverage/lcov.info

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}