services:
  postgres:
    image: postgres:16
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smartparking
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smartparking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  redis:
    image: redis:7
    container_name: smartparking-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartparking-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smartparking-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: "smartparking-local-cluster"
    networks:
      - smartparking-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartparking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: "0.4"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.4"
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartparking-network

  auth-service:
    build:
      context: ./smart-parking
      dockerfile: apps/auth-service/dockerfile
    container_name: smartparking-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin@postgres:5432/smartparking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret
      JWT_REFRESH_SECRET: your_refresh_secret
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
      FRONTEND_URL: http://localhost:3002
    ports:
      - '3000:3000'
    networks:
      - smartparking-network

  user-service:
    build:
      context: ./smart-parking
      dockerfile: apps/user-service/dockerfile
    container_name: smartparking-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      USER_SERVICE_PORT: 3001
      USER_DATABASE_URL: postgresql://admin:admin@postgres:5432/userdb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    ports:
      - '3001:3001'
    networks:
      - smartparking-network

  vehicle-service:
    build:
      context: ./smart-parking
      dockerfile: apps/vehicle-service/dockerfile
    container_name: smartparking-vehicle-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      VEHICLE_SERVICE_PORT: 3003
      VEHICLE_DATABASE_URL: postgresql://admin:admin@postgres:5432/vehicledb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    ports:
      - '3003:3003'
    networks:
      - smartparking-network

  parking-service:
    build:
      context: ./smart-parking
      dockerfile: apps/parking-service/dockerfile
    container_name: smartparking-parking-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      PARKING_SERVICE_PORT: 3004
      PARKING_DATABASE_URL: postgresql://admin:admin@postgres:5432/parkingdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    ports:
      - '3004:3004'
    networks:
      - smartparking-network

  reservation-service:
    build:
      context: ./smart-parking
      dockerfile: apps/reservation-service/dockerfile
    container_name: smartparking-reservation-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      RESERVATION_SERVICE_PORT: 3005
      RESERVATION_DATABASE_URL: postgresql://admin:admin@postgres:5432/reservationdb
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: your_jwt_secret
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      PARKING_SERVICE_URL: http://parking-service:3004
      USER_SERVICE_URL: http://user-service:3001
      VEHICLE_SERVICE_URL: http://vehicle-service:3003
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    ports:
      - '3005:3005'
    networks:
      - smartparking-network

  payment-service:
    build:
      context: ./smart-parking
      dockerfile: apps/payment-service/dockerfile
    container_name: smartparking-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reservation-service:
        condition: service_started
      user-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      PAYMENT_SERVICE_PORT: 3007
      PAYMENT_DATABASE_URL: postgresql://admin:admin@postgres:5432/paymentdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: your_jwt_secret
      INTERNAL_SERVICE_KEY: internal_service_secret_key
      RESERVATION_SERVICE_URL: http://reservation-service:3005
      USER_SERVICE_URL: http://user-service:3001
      KAFKA_BROKERS: kafka:29092
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLIC_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    ports:
      - '3007:3007'
    networks:
      - smartparking-network

  frontend:
    build:
      context: ./smart-parking/apps/frontend
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:3006/api
    container_name: smartparking-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - user-service
      - vehicle-service
      - parking-service
      - reservation-service
      - payment-service
    ports:
      - '3002:3002'
    networks:
      - smartparking-network

  gateway-service:
    build:
      context: ./smart-parking
      dockerfile: apps/gateway-service/dockerfile
    container_name: smartparking-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      vehicle-service:
        condition: service_started
      parking-service:
        condition: service_started
      reservation-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      GATEWAY_PORT: 3006
      JWT_SECRET: your_jwt_secret
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3001
      VEHICLE_SERVICE_URL: http://vehicle-service:3003
      PARKING_SERVICE_URL: http://parking-service:3004
      RESERVATION_SERVICE_URL: http://reservation-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3007
      CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 60
    ports:
      - '3006:3006'
    networks:
      - smartparking-network

volumes:
  postgres_data:
  redis_data:

networks:
  smartparking-network:
    driver: bridge