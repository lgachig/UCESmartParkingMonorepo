services:
  postgres:
    image: postgres:16
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smartparking
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartparking-network

  redis:
    image: redis:7
    container_name: smartparking-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - smartparking-network


  auth-service:
    build:
      context: ./smart-parking
      dockerfile: apps/auth-service/Dockerfile
    container_name: smartparking-auth-service
    restart: unless-stopped
    depends_on: 
      - postgres
      - redis
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin@postgres:5432/smartparking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret
      JWT_REFRESH_SECRET: your_refresh_secret
    ports:
      - '3000:3000'
    networks:
      - smartparking-network

volumes:
  postgres_data:
  redis_data:

networks:
  smartparking-network:
    driver: bridge