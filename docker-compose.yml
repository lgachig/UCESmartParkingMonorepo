services:
  postgres:
    image: postgres:16
    container_name: smartparking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smartparking
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartparking-network

  redis:
    image: redis:7
    container_name: smartparking-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - smartparking-network

volumes:
  postgres_data:
  redis_data:

networks:
  smartparking-network:
    driver: bridge